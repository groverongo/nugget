name: Code validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.4.4
      - name: Run Biome
        run: biome ci .
  
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test
        run: pnpm run test
