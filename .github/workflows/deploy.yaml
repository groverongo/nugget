name: Code validation, Image building and Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{vars.DOCKER_REGISTRY}}/${{vars.DOCKER_REPOSITORY}}
  CONTAINER_NAME: nugget-bot-container

jobs:

  code-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "apps/bot/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: apps/bot/pnpm-lock.yaml

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.4.15
          
      - name: Run Biome
        run: ./nx run bot:lint
      
      - name: Install dependencies
        run: ./nx run bot:install
      - name: Build
        run: ./nx run bot:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test
        run: ./nx run bot:test
        env:
          DISCORD_TOKEN: GENERICO

  eval-migrations:
    name: migrations test
    needs: code-validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nugget
          POSTGRES_PASSWORD: nugget
          POSTGRES_DB: nugget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nugget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "apps/bot/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: apps/bot/pnpm-lock.yaml

      - name: Install dependencies
        run: ./nx run bot:install

      - name: Apply migrations
        env:
          DISCORD_TOKEN: GENERICO
          DISCORD_OWNER_ID: GENERICO
          DISCORD_ANNOUNCEMENTS_CHANNEL_ID: GENERICO
          DISCORD_ALERTS_CHANNEL_ID: GENERICO
          DATABASE_URL: postgres://nugget:nugget@localhost:5432/nugget?sslmode=disable
        run: ./nx run bot:migrate-up

  deploy:
    needs: eval-migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/bot
          file: ./apps/bot/Dockerfile 
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to VM via SSH
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm   ${{ env.CONTAINER_NAME }} || true
            docker run --rm \
              -e DISCORD_TOKEN="${{ secrets.DISCORD_TOKEN }}" \
              -e NODE_ENV=production \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e DISCORD_OWNER_ID="${{secrets.DISCORD_OWNER_ID}}" \
              -e DISCORD_ANNOUNCEMENTS_CHANNEL_ID="${{secrets.DISCORD_ANNOUNCEMENTS_CHANNEL_ID}}" \
              -e DISCORD_ALERTS_CHANNEL_ID="${{secrets.DISCORD_ALERTS_CHANNEL_ID}}" \
              ${{ env.IMAGE }}:${{ github.sha }} dist/cmd/migration.js up
              docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e DISCORD_TOKEN="${{ secrets.DISCORD_TOKEN }}" \
              -e DISCORD_OWNER_ID="${{secrets.DISCORD_OWNER_ID}}" \
              -e DISCORD_ANNOUNCEMENTS_CHANNEL_ID="${{secrets.DISCORD_ANNOUNCEMENTS_CHANNEL_ID}}" \
              -e DISCORD_ALERTS_CHANNEL_ID="${{secrets.DISCORD_ALERTS_CHANNEL_ID}}" \
              ${{ env.IMAGE }}:${{ github.sha }}